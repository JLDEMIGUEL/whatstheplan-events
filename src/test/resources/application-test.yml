spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: localhost
      client:
        registration:
          cognito:
            client-id: client-id
            client-secret: client-secret
        provider:
          cognito:
            token-uri: http://localhost:8091/oauth2/token

redis:
  host: localhost
  port: 6379
  password: ""

user-service:
  url: http://localhost:8090