server:
  port: 8080

spring:
  application:
    name: events
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${AUTH_SERVER_URL:localhost}
      client:
        registration:
          cognito:
            client-id: ${AUTH_CLIENT_ID}
            client-secret: ${AUTH_CLIENT_SECRET}
            authorization-grant-type: client_credentials
        provider:
          cognito:
            token-uri: ${AUTH_TOKEN_URL}
  r2dbc:
    url: r2dbc:postgresql://${DB_HOST:localhost}:5432/whatstheplan?currentSchema=events&ssl=true&sslmode=require
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  flyway:
    schemas: events
    baseline-on-migrate: true
    enabled: true
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/whatstheplan?currentSchema=events
    user: ${DB_USER}
    password: ${DB_PASSWORD}

aws:
  s3:
    accessKey: ${S3_ACCESS_KEY:}
    secretKey: ${S3_SECRET_KEY:}
    bucketName: ${S3_BUCKET:}
    region: ${S3_REGION:eu-west-1}

redis:
  host: ${REDIS_HOST}
  port: 6379
  password: ${REDIS_PASSWORD}

user-service:
  url: ${USER_SERVICE_URL}

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true